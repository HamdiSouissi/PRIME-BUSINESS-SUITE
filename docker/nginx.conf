server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Types MIME explicites : garantit text/css et text/javascript même si la
    # configuration http de l'image de base venait à changer (sinon le navigateur
    # refuse d'appliquer le CSS : « strict MIME type checking »).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets hashés par Vite : cache long et immuable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aucun vrai favicon ni service worker dans le build : ne pas renvoyer
    # index.html (200 text/html) pour ces chemins.
    location = /favicon.ico {
        return 204;
        access_log off;
    }
    location = /sw.js {
        return 404;
        access_log off;
    }

    # SPA : renvoi vers index.html pour les routes React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxifiée vers le backend (même réseau docker-compose)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
