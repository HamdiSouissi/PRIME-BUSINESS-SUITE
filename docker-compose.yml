# Prime Business Suite — pile complète (compatible Windows Docker Desktop).
# Démarrage : `docker compose up --build` depuis la racine du dépôt.
# Configuration : copier `.env.example` vers `.env` (jamais commité).
# ⚠️ Ce fichier est livré validé statiquement : il n'a pas pu être testé
#    dans l'environnement de développement (pas de Docker dans le sandbox) —
#    procédure de vérification décrite dans docs/deploiement.md.

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pbs}
      POSTGRES_USER: ${POSTGRES_USER:-pbs}
      # ⚠️ Ce mot de passe n'est appliqué qu'à la PREMIÈRE initialisation du
      #    volume pgdata. Si le volume existe déjà (changement de .env, restauration),
      #    le rôle garde son ancien mot de passe → « FATAL: password authentication
      #    failed for user "pbs" ». Solutions dans docs/demarrage.md (§ Dépannage).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changez-moi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # Authentification réelle sur TCP : un décalage de mot de passe rend le
      # service « unhealthy » (visible dans `docker compose ps`) au lieu d'un
      # crash tardif du backend et d'un 502 nginx peu explicite.
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc 'SELECT 1'",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      # Noms courts reconnus par backend/config/settings.py (alias DJANGO_*).
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-a-changer}
      DEBUG: "0"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,frontend}
      DATABASE_URL: postgres://pbs:${POSTGRES_PASSWORD:-changez-moi}@db:5432/pbs
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # nginx sert l'application en HTTP pur (pas de TLS dans cette stack) :
      # sans cette ligne, Django (DEBUG=0) renvoie un 301 vers https sur chaque
      # appel d'API, dont /api/auth/login/ → ERR_CONNECTION_REFUSED en boucle.
      # Repasser à 1 (ou supprimer la variable) devant un vrai reverse proxy TLS
      # qui transmet X-Forwarded-Proto: https (SECURE_PROXY_SSL_HEADER est réglé).
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
      # DEMO_SEED=1 : crée le compte de démonstration au 1er démarrage
      # (admin@primevision.example / voir docs/demarrage.md) — JAMAIS en production
      DEMO_SEED: ${DEMO_SEED:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: celery -A config.celery worker --loglevel=info
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-a-changer}
      DATABASE_URL: postgres://pbs:${POSTGRES_PASSWORD:-changez-moi}@db:5432/pbs
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
      # Décommenter pour accéder aussi à l'app via http://localhost (port 80)
      # sans préciser le port. Évite qu'un « localhost » nu dans la barre
      # d'adresse soit basculé en https://localhost (port 443, rien n'y écoute
      # → ERR_CONNECTION_REFUSED). Inutile si le port 80 est déjà pris (IIS…).
      # - "80:80"

volumes:
  pgdata:
